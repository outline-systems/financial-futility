<style>
:root{--black:#0b0b0b;--ink:#151515;--muted:#686868;--line:#dedede;--pale:#f5f5f5;--white:#fff;--danger:#b42318;--ok:#18794e}*{box-sizing:border-box}body{margin:0;font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:var(--ink);background:#fff}.app{min-height:100vh;display:grid;grid-template-columns:265px 1fr}.side{background:var(--black);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column}.brand{border-bottom:1px solid #555;padding:0 8px 18px;margin-bottom:13px}.brand b{letter-spacing:2px;font-size:12px}.brand small{display:block;color:#a8a8a8;margin-top:3px}.nav{display:grid;gap:4px}.nav button{border:0;background:transparent;color:#eee;text-align:left;padding:11px 12px;border-radius:4px;font-size:14px;cursor:pointer}.nav button:hover,.nav button.active{background:#272727}.sidefoot{margin-top:auto;border-top:1px solid #555;padding:14px 8px 0;color:#b8b8b8;font-size:12px}.main{min-width:0}.bar{height:62px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:sticky;top:0;background:#fff;z-index:2}.bar h1{font-size:13px;letter-spacing:2px;margin:0}.bar span{font-size:10px;letter-spacing:1px;color:#777}.page{max-width:1500px;margin:auto;padding:34px 40px 60px}.eyebrow{font-size:10px;letter-spacing:2px;color:#777;text-transform:uppercase}.title{font-size:27px;letter-spacing:-.8px;margin:5px 0}.lead{color:#686868;margin:0 0 24px}.cards{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin:20px 0}.card{padding:20px;border-right:1px solid var(--line)}.card:last-child{border:0}.card.dark{background:#050505;color:#fff}.label{font-size:10px;letter-spacing:1.5px;color:#777;text-transform:uppercase}.dark .label{color:#b7b7b7}.value{font-size:26px;font-weight:700;margin:8px 0 3px}.sub{font-size:12px;color:#777}.dark .sub{color:#bbb}.section{border:1px solid var(--line);margin-top:18px}.sectionhead{padding:17px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.sectionhead h2{font-size:16px;margin:0}.sectionbody{padding:20px}button,.button{font:inherit;border:1px solid #c8c8c8;padding:9px 13px;border-radius:3px;background:#f5f5f5;cursor:pointer}.button.black,button.black{background:#080808;color:#fff;border-color:#080808}.button.danger{color:#fff;background:var(--danger);border-color:var(--danger)}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid2{display:grid;grid-template-columns:1.15fr .85fr;gap:18px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#777;font-size:10px;letter-spacing:1px;text-transform:uppercase;font-weight:600}th,td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}.right{text-align:right}.tag{font-size:10px;letter-spacing:.7px;border:1px solid #bdbdbd;border-radius:2px;padding:2px 5px;display:inline-block;text-transform:uppercase}.tag.good{border-color:#6aaa87;color:#12663c}.tag.warn{border-color:#c48b34;color:#895400}.tag.missing{border-color:#b44;color:#9d1717}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.full{grid-column:1/-1}label{display:grid;gap:6px;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#555}input,select,textarea{width:100%;border:1px solid #c8c8c8;border-radius:3px;padding:10px;background:#fff;font:14px inherit;color:#111}textarea{min-height:86px;resize:vertical}.notice{border-left:4px solid #111;padding:13px 15px;background:#f6f6f6;color:#444}.empty{padding:28px;color:#777;text-align:center}.hidden{display:none!important}.case{background:#080808;color:#fff;padding:20px}.case .sub{color:#c8c8c8}.kpi{display:flex;justify-content:space-between;border-bottom:1px solid #ddd;padding:11px 0;gap:12px}.kpi:last-child{border:0}.timeline{display:grid}.event{display:grid;grid-template-columns:145px 1fr;gap:18px;padding:13px 0;border-bottom:1px solid #ddd}.event:last-child{border-bottom:0}.event time{font-weight:600}.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:18px;z-index:4}.modalbox{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:5px}.modalhead{padding:18px 22px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}.modalbody{padding:22px}.modalfoot{padding:15px 22px;border-top:1px solid #ddd;display:flex;justify-content:flex-end;gap:8px}.toast{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 15px;border-radius:3px;z-index:9}.mobile{display:none}@media(max-width:850px){.app{display:block}.side{position:fixed;z-index:6;width:260px;transform:translateX(-105%);transition:.2s;height:100dvh}.side.open{transform:translateX(0)}.mobile{display:inline-block}.bar{padding:0 17px}.page{padding:24px 16px 42px}.cards,.grid2,.grid3{grid-template-columns:1fr}.card{border-right:0;border-bottom:1px solid var(--line)}.card:last-child{border-bottom:0}.event{grid-template-columns:1fr;gap:2px}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}table{min-width:720px}.tablewrap{overflow:auto}.sidefoot{margin-top:auto}}
</style></head>
<body><div class="app"><aside class="side" id="side"><div class="brand"><b>AT &nbsp; PERSONAL FINANCE</b><small>Private control centre · local-first</small></div><nav class="nav" id="nav"><button data-view="overview" class="active">▦ &nbsp; Overview</button><button data-view="budget">▣ &nbsp; Budget</button><button data-view="transactions">⇄ &nbsp; Transactions</button><button data-view="accounts">▥ &nbsp; Accounts</button><button data-view="debts">◔ &nbsp; Debts & assets</button><button data-view="income">$ &nbsp; Income target</button><button data-view="plan">☷ &nbsp; Financial plan</button><button data-view="documents">▤ &nbsp; Documents & evidence</button><button data-view="settings">⚙ &nbsp; Settings</button></nav><div class="sidefoot">Stored in this browser.<br>Use Export to create a backup.</div></aside><main class="main"><header class="bar"><div><button class="mobile" id="menu">☰</button> <h1 id="barTitle" style="display:inline">OVERVIEW</h1></div><span id="saveStatus">LOCAL DATA · PRIVATE TO THIS BROWSER</span></header><div class="page" id="page"></div></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
(function(){
'use strict';
var KEY='austenPersonalFinanceV2';
var seed={settings:{rate:160,tax:30,costs:10,buffer:4,aud:1.10},budget:[['Residential rent — personal share','Housing','Verified','Survival','Fortnightly',1020],['Power and household utilities','Utilities','Provisional','Survival','Fortnightly',225.71],['Internet and mobile','Utilities','Verified','Survival','Fortnightly',87],['Food and groceries','Groceries','Verified','Survival','Fortnightly',273],['Dependent-child support','Family','Verified','Survival','Fortnightly',208],['Visa Light minimum payment','Debt payment','Derived','Stability','Monthly',176.47],['Transport and fuel','Transport','Derived','Stability','Monthly',205.16],['Emergency cash reserve','Savings','Advised','Stability','Fortnightly',200],['Visa Light extra repayment','Debt payment','Advised','Recovery','Monthly',400]],accounts:[['ASB KiwiSaver Scheme','ASB','Personal','KiwiSaver',34724.42,'NZD'],['Streamline','ASB','Personal','Bank',189.49,'NZD'],['Visa Light','ASB','Personal','Credit card',5882.43,'NZD'],['GEM VISA','Latitude Finance','Personal','Credit card',6337.85,'NZD']],debts:[['6 Birdup Close mortgage','CommBank','Joint unresolved',441577.39,'AUD',0],['Visa Light','ASB','Current',5882.43,'NZD',13.5]],assets:[['6 Birdup Close — working property value','Property','Joint unresolved',1170000,'AUD'],['Essential Super (Australia)','Superannuation','Personal',143045.10,'AUD'],['ASB KiwiSaver Scheme','KiwiSaver','Personal',34724.42,'NZD']],transactions:[],plan:[['Now','Confirm Visa Light statement minimum and due date','Critical','Confirm the current card minimum, due date and statement balance.'],['Now','Hold spending to the survival line until revenue starts','High','Pause non-essential spending until income is stable.'],['Next','Load the latest Visa and CommBank statements','High','Upload and categorise current statements.'],['Next','Offer fixed-scope $1,800–$3,500 packages','High','Use clear deliverables, written exclusions and an upfront deposit.'],['Later','Treat Birdup equity as settlement capital, not cash flow','High','Do not treat unresolved property equity as available spending cash.']],documents:[['Property Settlement & Jurisdiction Brief','Legal advice & correspondence','2026-08-31','Birdup Close — Property Settlement','Filed','Preliminary client brief; privileged and confidential.']],caseChecklist:[['Current Landgate Record of Certificate of Title','Property purchase & title','Missing'],['Current market appraisal or formal valuation','Valuations & property costs','Missing'],['Relationship chronology and resumed-contact evidence','Relationship chronology','Missing'],['Current asset/liability and superannuation schedules','Assets, debts & superannuation','Missing'],["Finley’s post-separation preservation-payment evidence",'Valuations & property costs','Missing'],['Original VRO / relevant court orders','Court / VRO material','Missing'],['Current CBA mortgage balance confirmation','Mortgage & refinance','Missing'],['Contribution evidence pack and reconciliation workbook','Contributions & tracing','Missing']],timeline:[['25 Oct 2018','Offer & Acceptance signed for Birdup.'],['Dec 2018','Settlement funding completed; confirm final settlement date.'],['1 Oct 2021','Transfer labelled “Separation support” — chronology marker only.'],['3 Nov 2021','CBA refinance funded.'],['18 Nov 2021 onward','VRO operative by this point; source order required.'],['2022 onward','Later relationship/contact activity — retain evidence for advice.']]};
var db; try{db=JSON.parse(localStorage.getItem(KEY)||'null')||seed}catch(e){db=seed}
var view='overview';
function money(n,c){n=Number(n)||0;c=c==='AUD'?'AUD':'NZD';try{return new Intl.NumberFormat('en-NZ',{style:'currency',currency:c,minimumFractionDigits:2}).format(n)}catch(e){return (c==='AUD'?'A$':'$')+n.toFixed(2)}}
function monthly(f,n){return f==='Fortnightly'?(Number(n)||0)*26/12:(Number(n)||0)}
function esc(v){var s=String(v==null?'':v);return s.replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('saveStatus').textContent='SAVED LOCALLY · '+new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}catch(e){toast('Could not save browser data')}}
function toast(s){var t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},2600)}
function tag(s){var c=/missing|action/i.test(s)?'missing':/verified|filed|complete/i.test(s)?'good':/provisional|review/i.test(s)?'warn':'';return '<span class="tag '+c+'">'+esc(s)+'</span>'}
function openModal(title,body,saveFn,saveText){var m=document.getElementById('modal');m.innerHTML='<div class="modalbox"><div class="modalhead"><b>'+title+'</b><button id="closeModal">×</button></div><div class="modalbody">'+body+'</div><div class="modalfoot"><button id="cancelModal">Cancel</button><button class="black" id="saveModal">'+(saveText||'Save')+'</button></div></div>';m.classList.remove('hidden');function close(){m.classList.add('hidden')}document.getElementById('closeModal').onclick=close;document.getElementById('cancelModal').onclick=close;document.getElementById('saveModal').onclick=function(){if(saveFn()!==false)close()}}
function overview(){var surv=0,stab=0,rec=0;db.budget.forEach(function(x){var v=monthly(x[4],x[5]);if(x[3]==='Survival')surv+=v;if(x[3]!=='Recovery')stab+=v;rec+=v});var target=stab/(1-(db.settings.tax+db.settings.costs)/100),hours=target/db.settings.rate;return '<div class="eyebrow">Control centre</div><h2 class="title">Financial overview</h2><p class="lead">Planning records are local to this browser. Figures are working records, not financial or legal advice.</p><div class="cards"><div class="card"><div class="label">Available cash</div><div class="value">'+money(db.accounts.filter(function(a){return a[3]==='Bank'}).reduce(function(s,a){return s+a[4]},0))+'</div><div class="sub">Confirmed bank balances entered</div></div><div class="card"><div class="label">Survival budget</div><div class="value">'+money(surv)+'</div><div class="sub">Monthly living-cost floor</div></div><div class="card"><div class="label">Stability budget</div><div class="value">'+money(stab)+'</div><div class="sub">Recommended monthly plan</div></div><div class="card dark"><div class="label">Consulting target</div><div class="value">'+money(target)+'</div><div class="sub">'+hours.toFixed(1)+' billable hours / week equivalent</div></div></div><div class="grid2"><section class="section"><div class="sectionhead"><h2>Income requirement</h2><button onclick="go(\'income\')">Open model</button></div><div class="sectionbody"><div class="grid3"><div><div class="label">Survival</div><div class="value">'+money(surv)+'</div></div><div class="case"><div class="label">Stability · recommended</div><div class="value">'+money(target)+'</div><div class="sub">At '+money(db.settings.rate)+' / hour excl GST</div></div><div><div class="label">Recovery</div><div class="value">'+money(rec/(1-(db.settings.tax+db.settings.costs)/100))+'</div></div></div></div></section><section class="section"><div class="sectionhead"><h2>Birdup evidence status</h2><button onclick="go(\'documents\')">Open vault</button></div><div class="sectionbody"><div class="value">'+db.caseChecklist.filter(function(x){return x[2]==='Complete'}).length+' / '+db.caseChecklist.length+'</div><div class="sub">Required evidence items marked complete</div><div class="notice" style="margin-top:14px">Private legal and bank documents should not be committed to a public GitHub repository.</div></div></section></div><section class="section"><div class="sectionhead"><h2>Financial Fortification Plan</h2><button onclick="go(\'plan\')">Review actions →</button></div><div class="sectionbody"><div class="grid3">'+['Now','Next','Later'].map(function(col){return '<div><div class="label">'+col+'</div>'+db.plan.filter(function(x){return x[0]===col}).map(function(x){return '<div class="kpi"><span>'+esc(x[1])+'<br>'+tag(x[2])+'</span></div>'}).join('')+'</div>'}).join('')+'</div></div></section>'}
function budget(){var totals={Survival:0,Stability:0,Recovery:0};db.budget.forEach(function(x){totals[x[3]]+=monthly(x[4],x[5])});return '<div class="eyebrow">Personal outgoings</div><h2 class="title">Austen’s populated monthly budget</h2><p class="lead">Editable budget lines. Fortnightly entries are converted to monthly equivalents.</p><div class="actions"><button class="black" onclick="addBudget()">＋ Add item</button></div><div class="cards"><div class="card"><div class="label">Survival</div><div class="value">'+money(totals.Survival)+'</div></div><div class="card"><div class="label">Stability</div><div class="value">'+money(totals.Survival+totals.Stability)+'</div></div><div class="card dark"><div class="label">Recovery</div><div class="value">'+money(totals.Survival+totals.Stability+totals.Recovery)+'</div></div></div><section class="section"><div class="sectionhead"><h2>Budget register</h2></div><div class="tablewrap"><table><thead><tr><th>Item</th><th>Category</th><th>Figure</th><th>Priority</th><th>Frequency</th><th class="right">Entered</th><th class="right">Monthly</th><th></th></tr></thead><tbody>'+db.budget.map(function(x,i){return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+tag(x[2])+'</td><td>'+tag(x[3])+'</td><td>'+x[4]+'</td><td class="right">'+money(x[5])+'</td><td class="right">'+money(monthly(x[4],x[5]))+'</td><td><button onclick="del(\'budget\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table></div></section>'}
function transactions(){return '<div class="eyebrow">Actual spending</div><h2 class="title">Transaction review</h2><p class="lead">Import a CSV or add transactions manually. Data stays in this browser.</p><div class="actions"><button onclick="addTransaction()">＋ Manual</button><label class="button black" style="display:inline-block;color:#fff;letter-spacing:0;text-transform:none">Import CSV<input id="csv" type="file" accept=".csv" hidden onchange="importCSV(event)"></label></div><div class="cards"><div class="card"><div class="label">All rows</div><div class="value">'+db.transactions.length+'</div></div><div class="card"><div class="label">Money in</div><div class="value">'+money(db.transactions.filter(function(x){return x[3]>0}).reduce(function(s,x){return s+x[3]},0))+'</div></div><div class="card"><div class="label">Money out</div><div class="value">'+money(Math.abs(db.transactions.filter(function(x){return x[3]<0}).reduce(function(s,x){return s+x[3]},0)))+'</div></div><div class="card dark"><div class="label">Net total</div><div class="value">'+money(db.transactions.reduce(function(s,x){return s+x[3]},0))+'</div></div></div><section class="section"><div class="sectionbody"><input id="txSearch" placeholder="Search description, account or category" oninput="renderTransactions()"><div class="tablewrap" id="txTable" style="margin-top:12px"></div></div></section>'}
function renderTransactions(){var el=document.getElementById('txTable');if(!el)return;var q=(document.getElementById('txSearch').value||'').toLowerCase(),rows=db.transactions.filter(function(x){return x.join(' ').toLowerCase().indexOf(q)>-1});el.innerHTML=rows.length?'<table><thead><tr><th>Date</th><th>Account</th><th>Description</th><th>Category</th><th class="right">Amount</th><th></th></tr></thead><tbody>'+rows.map(function(x){var i=db.transactions.indexOf(x);return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td><td>'+esc(x[4])+'</td><td class="right">'+money(x[3])+'</td><td><button onclick="del(\'transactions\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">No transactions yet. Import a CSV or add one manually.</div>'}
function accounts(){return '<div class="eyebrow">Source accounts</div><h2 class="title">Banks, cards, loans and business bridge</h2><p class="lead">Add account balances manually. Credit-card balances are shown for reference and excluded from available cash.</p><div class="actions"><button class="black" onclick="addAccount()">＋ Add institution / account</button></div><section class="section"><div class="tablewrap"><table><thead><tr><th>Account</th><th>Institution</th><th>Scope</th><th>Type</th><th class="right">Balance</th><th>Currency</th><th></th></tr></thead><tbody>'+db.accounts.map(function(x,i){return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+tag(x[2])+'</td><td>'+esc(x[3])+'</td><td class="right">'+money(x[4],x[5])+'</td><td>'+x[5]+'</td><td><button onclick="del(\'accounts\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table></div></section>'}
function debts(){var nzdAssets=db.assets.filter(function(a){return a[4]==='NZD'}).reduce(function(s,a){return s+a[3]},0),nzdDebts=db.debts.filter(function(a){return a[4]==='NZD'}).reduce(function(s,a){return s+a[3]},0);return '<div class="eyebrow">Balance sheet</div><h2 class="title">Debts and assets</h2><p class="lead">Keep verified figures separate from working estimates. AUD values are not added into NZD totals.</p><div class="actions"><button onclick="addDebt()">＋ Debt</button><button class="black" onclick="addAsset()">＋ Asset</button></div><div class="cards"><div class="card"><div class="label">Known NZD assets</div><div class="value">'+money(nzdAssets)+'</div></div><div class="card"><div class="label">Known NZD liabilities</div><div class="value">'+money(nzdDebts)+'</div></div><div class="card dark"><div class="label">NZD net position</div><div class="value">'+money(nzdAssets-nzdDebts)+'</div></div><div class="card"><div class="label">Birdup gross equity</div><div class="value">'+money(1170000-441577.39,'AUD')+'</div><div class="sub">Working estimate only</div></div></div><section class="section"><div class="sectionhead"><h2>Liabilities</h2></div><div class="tablewrap"><table><thead><tr><th>Liability</th><th>Creditor</th><th>Status</th><th class="right">Balance</th><th>Currency</th><th>Rate</th><th></th></tr></thead><tbody>'+db.debts.map(function(x,i){return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+tag(x[2])+'</td><td class="right">'+money(x[3],x[4])+'</td><td>'+x[4]+'</td><td>'+x[5]+'%</td><td><button onclick="del(\'debts\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table></div></section><section class="section"><div class="sectionhead"><h2>Assets</h2></div><div class="tablewrap"><table><thead><tr><th>Asset</th><th>Type</th><th>Ownership</th><th class="right">Value</th><th>Currency</th><th></th></tr></thead><tbody>'+db.assets.map(function(x,i){return '<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+tag(x[2])+'</td><td class="right">'+money(x[3],x[4])+'</td><td>'+x[4]+'</td><td><button onclick="del(\'assets\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table></div></section>'}
function income(){var survival=db.budget.filter(function(x){return x[3]==='Survival'}).reduce(function(a,x){return a+monthly(x[4],x[5])},0),stability=db.budget.filter(function(x){return x[3]!=='Recovery'}).reduce(function(a,x){return a+monthly(x[4],x[5])},0),recovery=db.budget.reduce(function(a,x){return a+monthly(x[4],x[5])},0),reserve=1-(db.settings.tax+db.settings.costs)/100;function row(name,val){var t=val/reserve;return '<tr><td><b>'+name+'</b></td><td class="right">'+money(val)+'</td><td class="right">'+money(t)+'</td><td class="right">'+(t/db.settings.rate/4.333).toFixed(1)+' h</td></tr>'}return '<div class="eyebrow">Revenue bridge</div><h2 class="title">Revenue plan: sell expertise first</h2><p class="lead">Planning model only. GST, tax, cash flow, and actual sales must be handled separately as applicable.</p><div class="cards"><div class="card"><div class="label">Consulting rate</div><div class="value">'+money(db.settings.rate)+'<small> / hour</small></div></div><div class="card"><div class="label">Tax reserve</div><div class="value">'+db.settings.tax+'%</div></div><div class="card"><div class="label">Operating allowance</div><div class="value">'+db.settings.costs+'%</div></div><div class="card dark"><div class="label">Recommended target</div><div class="value">'+money(stability/reserve)+'</div></div></div><section class="section"><div class="sectionhead"><h2>Personal need → consulting revenue</h2><button onclick="go(\'settings\')">Adjust assumptions</button></div><div class="tablewrap"><table><thead><tr><th>Budget line</th><th class="right">Personal / month</th><th class="right">Consulting / month</th><th class="right">Hours / week</th></tr></thead><tbody>'+row('Survival',survival)+row('Stability',stability)+row('Recovery',recovery)+'</tbody></table></div></section>'}
function plan(){return '<div class="eyebrow">Execution</div><h2 class="title">Financial Fortification Plan</h2><p class="lead">A short live list linked to your records—not a separate report that goes stale.</p><div class="actions"><button class="black" onclick="addPlan()">＋ Add action</button></div><section class="section"><div class="grid3">'+['Now','Next','Later'].map(function(col){return '<div class="sectionbody"><div class="label">'+col+'</div>'+db.plan.filter(function(x){return x[0]===col}).map(function(x){var i=db.plan.indexOf(x);return '<div class="kpi"><span><b>'+esc(x[1])+'</b><br>'+tag(x[2])+'<br><span class="sub">'+esc(x[3])+'</span></span><button onclick="del(\'plan\','+i+')">×</button></div>'}).join('')+'</div>'}).join('')+'</div></section>'}
function documents(){var folders=['Property purchase & title','Mortgage & refinance','Contributions & tracing','Bank statements','Relationship chronology','Court / VRO material','Valuations & property costs','Assets, debts & superannuation','Legal advice & correspondence','To review'];return '<div class="eyebrow">Private case workspace</div><h2 class="title">Documents & evidence</h2><p class="lead">File register and preparation dashboard for private records. This local-first version stores document metadata in this browser; it does not securely publish source files.</p><div class="notice"><b>Privacy warning:</b> Do not upload confidential legal, VRO, identity, bank, title, or statement documents to a public GitHub repository. Use this as a local register and retain source files in secure private storage.</div><div class="actions" style="margin-top:18px"><button class="black" onclick="addDocument()">＋ Add document record</button><button onclick="exportData()">Export backup</button><label class="button">Import backup<input type="file" hidden accept="application/json" onchange="importData(event)"></label></div><div class="grid2"><section class="section"><div class="sectionhead"><h2>Birdup Close — settlement evidence</h2>'+tag('Working case')+'</div><div class="sectionbody"><div class="case"><div class="label">Property snapshot</div><div class="value">'+money(728422.61,'AUD')+'</div><div class="sub">Indicative gross equity: A$1,170,000 working value less A$441,577.39 working mortgage balance. Requires confirmation.</div></div><div style="margin-top:14px">'+db.caseChecklist.map(function(x,i){return '<div class="kpi"><span><b>'+esc(x[0])+'</b><br><span class="sub">'+esc(x[1])+'</span></span><span>'+tag(x[2])+' <button onclick="toggleCheck('+i+')">'+(x[2]==='Complete'?'Undo':'Complete')+'</button></span></div>'}).join('')+'</div></div></section><section class="section"><div class="sectionhead"><h2>Chronology</h2><button onclick="addTimeline()">＋ Event</button></div><div class="sectionbody"><div class="timeline">'+db.timeline.map(function(x){return '<div class="event"><time>'+esc(x[0])+'</time><div>'+esc(x[1])+'</div></div>'}).join('')+'</div><p class="sub" style="margin-top:15px">This is an evidence timeline, not a legal finding. Obtain WA family-law advice on legal effect, limitation, jurisdiction, entitlement, and strategy.</p></div></section></div><section class="section"><div class="sectionhead"><h2>Document register</h2><span>'+db.documents.length+' record'+(db.documents.length===1?'':'s')+'</span></div><div class="tablewrap"><table><thead><tr><th>Document</th><th>Folder</th><th>Date</th><th>Linked item</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody>'+db.documents.map(function(x,i){return '<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td><td>'+esc(x[3])+'</td><td>'+tag(x[4])+'</td><td>'+esc(x[5])+'</td><td><button onclick="del(\'documents\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table></div></section><section class="section"><div class="sectionhead"><h2>Retrospective folders</h2></div><div class="sectionbody"><div class="grid3">'+folders.map(function(f){return '<div class="kpi"><span>'+esc(f)+'</span><b>'+db.documents.filter(function(d){return d[1]===f}).length+'</b></div>'}).join('')+'</div></div></section>'}
function settings(){var s=db.settings;return '<div class="eyebrow">Model controls</div><h2 class="title">Planning assumptions</h2><p class="lead">These settings change forecast figures only. They do not alter imported source records.</p><section class="section"><div class="sectionbody"><form class="formgrid" onsubmit="saveSettings(event)"><label>Tax reserve allowance (%)<input name="tax" type="number" min="0" max="100" value="'+s.tax+'"></label><label>Business operating-cost allowance (%)<input name="costs" type="number" min="0" max="100" value="'+s.costs+'"></label><label>Target cash buffer (weeks)<input name="buffer" type="number" min="0" value="'+s.buffer+'"></label><label>Consulting rate (excl GST / hour)<input name="rate" type="number" min="0" step="1" value="'+s.rate+'"></label><label>AUD → NZD exchange rate<input name="aud" type="number" min="0" step="0.01" value="'+s.aud+'"></label><div class="full actions"><button class="black">Save assumptions</button><button type="button" class="danger" onclick="resetAll()">Reset all local data</button></div></form></div></section><section class="section"><div class="sectionhead"><h2>Backup</h2></div><div class="sectionbody"><p class="lead">Export regularly. Browser data can be cleared by device/browser changes.</p><div class="actions"><button class="black" onclick="exportData()">Export JSON backup</button><label class="button">Import JSON backup<input type="file" hidden accept="application/json" onchange="importData(event)"></label></div></div></section>'}
function render(){document.getElementById('barTitle').textContent=view.toUpperCase().replace('DOCUMENTS','DOCUMENTS & EVIDENCE');var buttons=document.querySelectorAll('.nav button');for(var i=0;i<buttons.length;i++)buttons[i].classList.toggle('active',buttons[i].getAttribute('data-view')===view);var funcs={overview:overview,budget:budget,transactions:transactions,accounts:accounts,debts:debts,income:income,plan:plan,documents:documents,settings:settings};document.getElementById('page').innerHTML=funcs[view]();if(view==='transactions')renderTransactions()}
window.go=function(v){view=v;document.getElementById('side').classList.remove('open');render()};document.getElementById('nav').onclick=function(e){var b=e.target.closest('button');if(b)window.go(b.getAttribute('data-view'))};document.getElementById('menu').onclick=function(){document.getElementById('side').classList.toggle('open')};
window.del=function(k,i){if(confirm('Delete this record?')){db[k].splice(i,1);save();render()}};
window.addBudget=function(){openModal('Add budget item','<div class="formgrid"><label>Item<input id="a"></label><label>Category<input id="b" value="Other"></label><label>Figure<select id="c"><option>Verified</option><option>Provisional</option><option>Derived</option><option>Advised</option></select></label><label>Priority<select id="d"><option>Survival</option><option>Stability</option><option>Recovery</option></select></label><label>Frequency<select id="e"><option>Monthly</option><option>Fortnightly</option></select></label><label>Amount<input id="f" type="number" step="0.01"></label></div>',function(){db.budget.push([document.getElementById('a').value,document.getElementById('b').value,document.getElementById('c').value,document.getElementById('d').value,document.getElementById('e').value,Number(document.getElementById('f').value)||0]);save();render()})};
window.addAccount=function(){openModal('Add account','<div class="formgrid"><label>Account name<input id="a"></label><label>Institution<input id="b"></label><label>Scope<select id="c"><option>Personal</option><option>Business</option></select></label><label>Account type<select id="d"><option>Bank</option><option>Credit card</option><option>Loan</option><option>KiwiSaver</option><option>Other</option></select></label><label>Balance<input id="e" type="number" step="0.01"></label><label>Currency<select id="f"><option>NZD</option><option>AUD</option></select></label></div>',function(){db.accounts.push([document.getElementById('a').value,document.getElementById('b').value,document.getElementById('c').value,document.getElementById('d').value,Number(document.getElementById('e').value)||0,document.getElementById('f').value]);save();render()})};
window.addDebt=function(){openModal('Add debt','<div class="formgrid"><label>Liability<input id="a"></label><label>Creditor<input id="b"></label><label>Status<input id="c" value="Current"></label><label>Balance<input id="d" type="number" step="0.01"></label><label>Currency<select id="e"><option>NZD</option><option>AUD</option></select></label><label>Interest rate %<input id="f" type="number" step="0.01" value="0"></label></div>',function(){db.debts.push([document.getElementById('a').value,document.getElementById('b').value,document.getElementById('c').value,Number(document.getElementById('d').value)||0,document.getElementById('e').value,Number(document.getElementById('f').value)||0]);save();render()})};
window.addAsset=function(){openModal('Add asset','<div class="formgrid"><label>Asset<input id="a"></label><label>Type<input id="b"></label><label>Ownership<input id="c" value="Personal"></label><label>Value<input id="d" type="number" step="0.01"></label><label>Currency<select id="e"><option>NZD</option><option>AUD</option></select></label></div>',function(){db.assets.push([document.getElementById('a').value,document.getElementById('b').value,document.getElementById('c').value,Number(document.getElementById('d').value)||0,document.getElementById('e').value]);save();render()})};
window.addTransaction=function(){openModal('Add transaction','<div class="formgrid"><label>Date<input id="a" type="date"></label><label>Account<input id="b"></label><label class="full">Description<input id="c"></label><label>Amount (income positive, spending negative)<input id="d" type="number" step="0.01"></label><label>Category<input id="e" value="Uncategorised"></label></div>',function(){db.transactions.unshift([document.getElementById('a').value,document.getElementById('b').value,document.getElementById('c').value,Number(document.getElementById('d').value)||0,document.getElementById('e').value]);save();render()})};
window.addPlan=function(){openModal('Add action','<div class="formgrid"><label>Column<select id="a"><option>Now</option><option>Next</option><option>Later</option></select></label><label>Priority<select id="b"><option>Critical</option><option>High</option><option>Medium</option></select></label><label class="full">Action<input id="c"></label><label class="full">Notes<textarea id="d"></textarea></label></div>',function(){db.plan.push([document.getElementById('a').value,document.getElementById('c').value,document.getElementById('b').value,document.getElementById('d').value]);save();render()})};
window.addDocument=function(){var opts=['Property purchase & title','Mortgage & refinance','Contributions & tracing','Bank statements','Relationship chronology','Court / VRO material','Valuations & property costs','Assets, debts & superannuation','Legal advice & correspondence','To review'].map(function(x){return '<option>'+x+'</option>'}).join('');openModal('Add document record','<div class="notice">This register stores metadata only. Keep the actual confidential file in secure private storage; do not put it in a public GitHub repository.</div><div class="formgrid" style="margin-top:14px"><label>Document title<input id="a"></label><label>Document date<input id="b" type="date"></label><label>Folder<select id="c">'+opts+'</select></label><label>Linked item / case<input id="d" value="Birdup Close — Property Settlement"></label><label>Status<select id="e"><option>To review</option><option>Filed</option><option>Action required</option><option>Verified</option></select></label><label class="full">Notes / secure storage reference<textarea id="f"></textarea></label></div>',function(){var a=document.getElementById('a').value;if(!a){toast('Enter a document title');return false}db.documents.push([a,document.getElementById('c').value,document.getElementById('b').value,document.getElementById('d').value,document.getElementById('e').value,document.getElementById('f').value]);save();render()})};
window.addTimeline=function(){openModal('Add chronology event','<div class="formgrid"><label>Date / period<input id="a" placeholder="e.g. 01 Oct 2021"></label><label class="full">Event / evidence note<textarea id="b"></textarea></label></div>',function(){db.timeline.push([document.getElementById('a').value,document.getElementById('b').value]);save();render()})};window.toggleCheck=function(i){db.caseChecklist[i][2]=db.caseChecklist[i][2]==='Complete'?'Missing':'Complete';save();render()};
window.saveSettings=function(e){e.preventDefault();var f=e.target;db.settings={rate:Number(f.rate.value)||0,tax:Number(f.tax.value)||0,costs:Number(f.costs.value)||0,buffer:Number(f.buffer.value)||0,aud:Number(f.aud.value)||0};save();toast('Assumptions saved');render()};
window.exportData=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='personal-finance-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},200);toast('Backup exported')};window.importData=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{db=JSON.parse(r.result);save();render();toast('Backup imported')}catch(err){toast('That file is not a valid backup')}};r.readAsText(f)};window.importCSV=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var lines=r.result.split(/\r?\n/).filter(Boolean),rows=lines.slice(1).map(function(line){return line.split(',').map(function(x){return x.trim().replace(/^"|"$/g,'')})}).filter(function(x){return x.length>=4});rows.forEach(function(x){db.transactions.push([x[0]||'',x[1]||'',x[2]||'',parseFloat((x[3]||'0').replace(/[^0-9.-]/g,''))||0,x[4]||'Uncategorised'])});save();render();toast(rows.length+' transaction rows imported')};r.readAsText(f)};window.resetAll=function(){if(confirm('Reset all local app data? This cannot be undone unless you have exported a backup.')){db=JSON.parse(JSON.stringify(seed));save();render();toast('Local data reset')}};
try{render()}catch(err){document.getElementById('page').innerHTML='<section class="section"><div class="sectionbody"><h2>App startup issue</h2><p>The interface loaded but the data view did not start.</p><pre style="white-space:pre-wrap">'+esc(err.message||err)+'</pre></div></section>';console.error(err)}
})();
</script></body></html>
