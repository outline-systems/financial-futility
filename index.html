:1px solid var(--line)}.modal-head b{font:700 18px var(--ui)}.modal-body{padding:19px}.modal-foot{justify-content:flex-end;gap:8px;border-top:1px solid var(--line);border-bottom:0}.toast{position:fixed;right:18px;bottom:18px;z-index:20;color:#fff;background:#111;padding:12px 15px;border-radius:4px;font:14px var(--ui)}.empty{color:#76767b;text-align:center;padding:28px}.hide{display:none!important}@media(max-width:900px){.shell{display:block}.rail{position:fixed;z-index:8;left:0;transform:translateX(-105%);transition:transform .18s;width:252px;height:100dvh}.rail.open{transform:none}.mobile-menu{display:inline-block;margin-right:10px}.topbar{padding:0 16px}.canvas{padding:24px 16px 44px}.toolbar{margin:0 0 15px;justify-content:flex-start}.kpis,.grid2,.grid3{grid-template-columns:1fr}.kpi{border-right:0;border-bottom:1px solid var(--line);min-height:95px}.kpi:last-child{border-bottom:0}.timeline-item{grid-template-columns:1fr;gap:4px}.form-grid{grid-template-columns:1fr}.full{grid-column:auto}.table-wrap table{min-width:730px}.page-title{font-size:27px}}

<body><div class="shell"><aside class="rail" id="rail"><div class="identity"><div class="identity-row"><div class="mark">AT</div><div><b>PERSONAL FINANCE</b><small>Private control centre · local-first</small></div></div></div><nav class="nav" id="nav"><button class="active" data-view="overview"><span class="ico">▦</span>Overview</button><button data-view="budget"><span class="ico">▣</span>Budget</button><button data-view="transactions"><span class="ico">⇄</span>Transactions</button><button data-view="accounts"><span class="ico">▥</span>Accounts</button><button data-view="debts"><span class="ico">◔</span>Debts &amp; assets</button><button data-view="income"><span class="ico">$</span>Income target</button><button data-view="plan"><span class="ico">☷</span>Financial fortification</button><button data-view="documents"><span class="ico">▤</span>Documents &amp; evidence</button><button data-view="settings"><span class="ico">⚙</span>Settings</button></nav><div class="rail-foot">Stored in this browser.<br>Use Export to create a backup.</div></aside><main class="main"><header class="topbar"><div><button class="btn btn-sm mobile-menu" id="menu">☰</button><h1 id="barTitle" style="display:inline">OVERVIEW</h1></div><div class="state" id="saveState">LOCAL DATA · PRIVATE TO THIS BROWSER</div></header><div class="canvas" id="page"></div></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
(function(){'use strict';var KEY='personalFinanceCleanV1';var seed={settings:{rate:160,tax:30,costs:10,buffer:4,aud:1.10},budget:[['Residential rent — personal share','Housing','Verified','Survival','Fortnightly',1020],['Power and household utilities','Utilities','Provisional','Survival','Fortnightly',225.71],['Internet and mobile','Utilities','Verified','Survival','Fortnightly',87],['Food and groceries','Groceries','Verified','Survival','Fortnightly',273],['Dependent-child support','Family','Verified','Survival','Fortnightly',208],['Visa Light minimum payment','Debt payment','Derived','Stability','Monthly',176.47],['Transport and fuel','Transport','Derived','Stability','Monthly',205.16],['Emergency cash reserve','Savings','Advised','Stability','Fortnightly',200],['Visa Light extra repayment','Debt payment','Advised','Recovery','Monthly',400]],accounts:[['ASB KiwiSaver Scheme','ASB','Personal','KiwiSaver',34724.42,'NZD'],['Streamline','ASB','Personal','Bank',189.49,'NZD'],['Visa Light','ASB','Personal','Credit card',5882.43,'NZD'],['GEM VISA','Latitude Finance','Personal','Credit card',6337.85,'NZD']],debts:[['6 Birdup Close mortgage','CommBank','Joint unresolved',441577.39,'AUD',0],['Visa Light','ASB','Current',5882.43,'NZD',13.5]],assets:[['6 Birdup Close — working property value','Property','Joint unresolved',1170000,'AUD'],['Essential Super (Australia)','Superannuation','Personal',143045.10,'AUD'],['ASB KiwiSaver Scheme','KiwiSaver','Personal',34724.42,'NZD']],transactions:[],plan:[['Now','Confirm Visa Light statement minimum and due date','Critical','Confirm the current card minimum, due date and statement balance.'],['Now','Hold spending to the survival line until revenue starts','High','Pause non-essential spending until income is stable.'],['Next','Load the latest Visa and CommBank statements','High','Upload and categorise current statements.'],['Next','Offer fixed-scope $1,800–$3,500 packages','High','Use clear deliverables, written exclusions and an upfront deposit.'],['Later','Treat Birdup equity as settlement capital, not cash flow','High','Do not treat unresolved property equity as available spending cash.']],documents:[['Property Settlement & Jurisdiction Brief','Legal advice & correspondence','2026-08-31','Birdup Close — Property Settlement','Filed','Preliminary client brief; privileged and confidential.']],caseChecklist:[['Current Landgate Record of Certificate of Title','Property purchase & title','Missing'],['Current market appraisal or formal valuation','Valuations & property costs','Missing'],['Relationship chronology and resumed-contact evidence','Relationship chronology','Missing'],['Current asset/liability and superannuation schedules','Assets, debts & superannuation','Missing'],["Finley’s post-separation preservation-payment evidence",'Valuations & property costs','Missing'],['Original VRO / relevant court orders','Court / VRO material','Missing'],['Current CBA mortgage balance confirmation','Mortgage & refinance','Missing'],['Contribution evidence pack and reconciliation workbook','Contributions & tracing','Missing']],timeline:[['25 Oct 2018','Offer & Acceptance signed for Birdup.'],['Dec 2018','Settlement funding completed; confirm final settlement date.'],['1 Oct 2021','Transfer labelled “Separation support” — chronology marker only.'],['3 Nov 2021','CBA refinance funded.'],['18 Nov 2021 onward','VRO operative by this point; source order required.'],['2022 onward','Later relationship/contact activity — retain evidence for advice.']]};var db;try{db=JSON.parse(localStorage.getItem(KEY)||'null')||seed}catch(e){db=seed}var view='overview';function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function money(n,c){n=Number(n)||0;c=c==='AUD'?'AUD':'NZD';try{return new Intl.NumberFormat('en-NZ',{style:'currency',currency:c,minimumFractionDigits:2}).format(n)}catch(e){return(c==='AUD'?'A$':'$')+n.toFixed(2)}}function monthly(f,n){return f==='Fortnightly'?(Number(n)||0)*26/12:(Number(n)||0)}function badge(s){var c=/missing|action/i.test(s)?'missing':/verified|filed|complete/i.test(s)?'good':/provisional|review/i.test(s)?'warn':'';return'<span class="badge '+c+'">'+esc(s)+'</span>'}function save(){try{localStorage.setItem(KEY,JSON.stringify(db));document.getElementById('saveState').textContent='SAVED LOCALLY · '+new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}catch(e){toast('Could not save browser data')}}function toast(s){var t=document.getElementById('toast');t.textContent=s;t.classList.remove('hidden');setTimeout(function(){t.classList.add('hidden')},2600)}function panel(title,body,button){return'<section class="panel"><div class="panel-head"><h2>'+title+'</h2>'+ (button||'')+'</div>'+body+'</section>'}function overview(){var sv=0,st=0,rc=0;db.budget.forEach(function(x){var v=monthly(x[4],x[5]);if(x[3]==='Survival')sv+=v;if(x[3]!=='Recovery')st+=v;rc+=v});var target=st/(1-(db.settings.tax+db.settings.costs)/100),hrs=target/db.settings.rate;return'<div class="eyebrow">Control centre</div><h2 class="page-title">Personal finance overview</h2><p class="lead">A local-first planning workspace for cash flow, income, debts, assets, financial fortification and evidence preparation.</p><div class="kpis"><div class="kpi"><div class="label">Available cash</div><div class="amount">'+money(db.accounts.filter(function(a){return a[3]==='Bank'}).reduce(function(s,a){return s+a[4]},0))+'</div><div class="sub">Entered bank balances</div></div><div class="kpi"><div class="label">Survival budget</div><div class="amount">'+money(sv)+'</div><div class="sub">Monthly living-cost floor</div></div><div class="kpi"><div class="label">Stability budget</div><div class="amount">'+money(st)+'</div><div class="sub">Recommended monthly plan</div></div><div class="kpi dark"><div class="label">Revenue target</div><div class="amount">'+money(target)+'</div><div class="sub">'+hrs.toFixed(1)+' billable hours / week</div></div></div><div class="grid2">'+panel('Income requirement','<div class="panel-body"><div class="grid3"><div><div class="label">Survival</div><div class="amount">'+money(sv)+'</div><div class="sub">Monthly minimum</div></div><div class="case"><div class="label">Stability · recommended</div><div class="amount">'+money(target)+'</div><div class="sub">At '+money(db.settings.rate)+' per hour excl GST</div></div><div><div class="label">Recovery</div><div class="amount">'+money(rc/(1-(db.settings.tax+db.settings.costs)/100))+'</div><div class="sub">Including accelerated repayment</div></div></div></div>','<button class="btn" onclick="go(\'income\')">Open model</button>')+panel('Evidence status','<div class="panel-body"><div class="amount">'+db.caseChecklist.filter(function(x){return x[2]==='Complete'}).length+' / '+db.caseChecklist.length+'</div><div class="sub">Birdup evidence requirements complete</div><div class="note" style="margin-top:15px">Keep confidential source files in secure private storage. Use this app as the register and evidence tracker.</div></div>','<button class="btn" onclick="go(\'documents\')">Open vault</button>')+'</div>'+panel('Financial fortification plan','<div class="panel-body"><div class="grid3">'+['Now','Next','Later'].map(function(col){return'<div><div class="label">'+col+'</div>'+db.plan.filter(function(x){return x[0]===col}).map(function(x){return'<div class="rule-row"><span><b>'+esc(x[1])+'</b><br>'+badge(x[2])+'</span></div>'}).join('')+'</div>'}).join('')+'</div></div>','<button class="btn" onclick="go(\'plan\')">Review actions →</button>')}
function budget(){var t={Survival:0,Stability:0,Recovery:0};db.budget.forEach(function(x){t[x[3]]+=monthly(x[4],x[5])});return'<div class="eyebrow">Personal outgoings</div><h2 class="page-title">Austen’s populated monthly budget</h2><p class="lead">The survival line comes from documented hardship figures. Stability and recovery add clearly marked derived or advised amounts.</p><div class="toolbar"><button class="btn btn-dark" onclick="addBudget()">＋ Add item</button></div><div class="kpis"><div class="kpi"><div class="label">Survival</div><div class="amount">'+money(t.Survival)+'</div><div class="sub">Monthly living-cost floor</div></div><div class="kpi"><div class="label">Stability · recommended</div><div class="amount">'+money(t.Survival+t.Stability)+'</div><div class="sub">Living plus required reserves</div></div><div class="kpi dark"><div class="label">Recovery</div><div class="amount">'+money(t.Survival+t.Stability+t.Recovery)+'</div><div class="sub">Adds accelerated repayment</div></div></div>'+panel('Budget register','<div class="table-wrap"><table><thead><tr><th>Item</th><th>Category</th><th>Figure</th><th>Priority</th><th>Frequency</th><th class="number">Entered</th><th class="number">Monthly</th><th></th></tr></thead><tbody>'+db.budget.map(function(x,i){return'<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1])+'</td><td>'+badge(x[2])+'</td><td>'+badge(x[3])+'</td><td>'+x[4]+'</td><td class="number">'+money(x[5])+'</td><td class="number">'+money(monthly(x[4],x[5]))+'</td><td><button class="btn btn-sm" onclick="del(\'budget\','+i+')">Delete</button></td></tr>'}).join('')+'<tr class="total-row"><td colspan="6">Recovery monthly outgoings</td><td class="number">'+money(t.Survival+t.Stability+t.Recovery)+'</td><td></td></tr></tbody></table></div>')}
function transactions(){var inn=db.transactions.filter(function(x){return x[3]>0}).reduce(function(s,x){return s+x[3]},0),out=Math.abs(db.transactions.filter(function(x){return x[3]<0}).reduce(function(s,x){return s+x[3]},0));return'<div class="eyebrow">Actual spending</div><h2 class="page-title">Transaction review</h2><p class="lead">Add items manually or import a basic CSV: date, account, description, amount, category.</p><div class="toolbar"><button class="btn" onclick="addTransaction()">＋ Manual</button><label class="btn btn-dark">Import CSV<input type="file" hidden accept=".csv" onchange="importCSV(event)"></label></div><div class="kpis"><div class="kpi"><div class="label">All rows</div><div class="amount">'+db.transactions.length+'</div><div class="sub">Current transaction set</div></div><div class="kpi"><div class="label">Money in</div><div class="amount">'+money(inn)+'</div></div><div class="kpi"><div class="label">Money out</div><div class="amount">'+money(out)+'</div></div><div class="kpi dark"><div class="label">Net total</div><div class="amount">'+money(inn-out)+'</div></div></div>'+panel('Transactions','<div class="panel-body"><input id="txSearch" placeholder="Search description, account or category" oninput="renderTransactions()"><div class="table-wrap" id="txTable" style="margin-top:14px"></div></div>')}
function renderTransactions(){var e=document.getElementById('txTable');if(!e)return;var q=(document.getElementById('txSearch').value||'').toLowerCase(),rows=db.transactions.filter(function(x){return x.join(' ').toLowerCase().indexOf(q)>-1});e.innerHTML=rows.length?'<table><thead><tr><th>Date</th><th>Account</th><th>Description</th><th>Category</th><th class="number">Amount</th><th></th></tr></thead><tbody>'+rows.map(function(x){var i=db.transactions.indexOf(x);return'<tr><td>'+esc(x[0])+'</td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td><td>'+esc(x[4])+'</td><td class="number">'+money(x[3])+'</td><td><button class="btn btn-sm" onclick="del(\'transactions\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table>':'<div class="empty">No transactions yet. Import a CSV or add one manually.</div>'}
function accounts(){return'<div class="eyebrow">Source accounts</div><h2 class="page-title">Banks, cards, loans and business bridge</h2><p class="lead">Enter balances manually. Bank balances contribute to available cash; cards remain visible for reconciliation.</p><div class="toolbar"><button class="btn btn-dark" onclick="addAccount()">＋ Add account</button></div>'+panel('Accounts','<div class="table-wrap"><table><thead><tr><th>Account</th><th>Institution</th><th>Scope</th><th>Type</th><th class="number">Balance</th><th>Currency</th><th></th></tr></thead><tbody>'+db.accounts.map(function(x,i){return'<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1])+'</td><td>'+badge(x[2])+'</td><td>'+esc(x[3])+'</td><td class="number">'+money(x[4],x[5])+'</td><td>'+x[5]+'</td><td><button class="btn btn-sm" onclick="del(\'accounts\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table></div>')}
function debts(){var a=db.assets.filter(function(x){return x[4]==='NZD'}).reduce(function(s,x){return s+x[3]},0),d=db.debts.filter(function(x){return x[4]==='NZD'}).reduce(function(s,x){return s+x[3]},0);return'<div class="eyebrow">Balance sheet</div><h2 class="page-title">Debts and assets</h2><p class="lead">Keep verified figures distinct from working estimates. AUD values are shown separately from NZD totals.</p><div class="toolbar"><button class="btn" onclick="addDebt()">＋ Debt</button><button class="btn btn-dark" onclick="addAsset()">＋ Asset</button></div><div class="kpis"><div class="kpi"><div class="label">Known NZD assets</div><div class="amount">'+money(a)+'</div></div><div class="kpi"><div class="label">Known NZD liabilities</div><div class="amount">'+money(d)+'</div></div><div class="kpi dark"><div class="label">NZD net position</div><div class="amount">'+money(a-d)+'</div></div><div class="kpi"><div class="label">Birdup gross equity</div><div class="amount">'+money(728422.61,'AUD')+'</div><div class="sub">Working estimate only</div></div></div>'+panel('Liabilities','<div class="table-wrap"><table><thead><tr><th>Liability</th><th>Creditor</th><th>Status</th><th class="number">Balance</th><th>Currency</th><th>Rate</th><th></th></tr></thead><tbody>'+db.debts.map(function(x,i){return'<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1])+'</td><td>'+badge(x[2])+'</td><td class="number">'+money(x[3],x[4])+'</td><td>'+x[4]+'</td><td>'+x[5]+'%</td><td><button class="btn btn-sm" onclick="del(\'debts\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table></div>')+panel('Assets','<div class="table-wrap"><table><thead><tr><th>Asset</th><th>Type</th><th>Ownership</th><th class="number">Value</th><th>Currency</th><th></th></tr></thead><tbody>'+db.assets.map(function(x,i){return'<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1])+'</td><td>'+badge(x[2])+'</td><td class="number">'+money(x[3],x[4])+'</td><td>'+x[4]+'</td><td><button class="btn btn-sm" onclick="del(\'assets\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table></div>')}
function income(){var sv=db.budget.filter(function(x){return x[3]==='Survival'}).reduce(function(s,x){return s+monthly(x[4],x[5])},0),st=db.budget.filter(function(x){return x[3]!=='Recovery'}).reduce(function(s,x){return s+monthly(x[4],x[5])},0),rc=db.budget.reduce(function(s,x){return s+monthly(x[4],x[5])},0),keep=1-(db.settings.tax+db.settings.costs)/100;function row(n,v){var r=v/keep;return'<tr><td><b>'+n+'</b></td><td class="number">'+money(v)+'</td><td class="number">'+money(r)+'</td><td class="number">'+(r/db.settings.rate/4.333).toFixed(1)+' h</td></tr>'}return'<div class="eyebrow">Revenue bridge</div><h2 class="page-title">Revenue plan: sell expertise first</h2><p class="lead">This planning model converts personal budget levels into consulting revenue and weekly billable-hour targets.</p><div class="kpis"><div class="kpi"><div class="label">Consulting rate</div><div class="amount">'+money(db.settings.rate)+'</div><div class="sub">Per hour excl GST</div></div><div class="kpi"><div class="label">Tax reserve</div><div class="amount">'+db.settings.tax+'%</div></div><div class="kpi"><div class="label">Operating allowance</div><div class="amount">'+db.settings.costs+'%</div></div><div class="kpi dark"><div class="label">Recommended target</div><div class="amount">'+money(st/keep)+'</div></div></div>'+panel('Personal need → consulting revenue','<div class="table-wrap"><table><thead><tr><th>Budget line</th><th class="number">Personal / month</th><th class="number">Consulting / month</th><th class="number">Hours / week</th></tr></thead><tbody>'+row('Survival',sv)+row('Stability',st)+row('Recovery',rc)+'</tbody></table></div>','<button class="btn" onclick="go(\'settings\')">Adjust assumptions</button>')}
function plan(){return'<div class="eyebrow">Execution</div><h2 class="page-title">Financial fortification plan</h2><p class="lead">A short working action board for immediate protection, next actions and longer-term items.</p><div class="toolbar"><button class="btn btn-dark" onclick="addPlan()">＋ Add action</button></div>'+panel('Action board','<div class="grid3">'+['Now','Next','Later'].map(function(col){return'<div class="panel-body"><div class="label">'+col+'</div>'+db.plan.filter(function(x){return x[0]===col}).map(function(x){var i=db.plan.indexOf(x);return'<div class="rule-row"><span><b>'+esc(x[1])+'</b><br>'+badge(x[2])+'<br><span class="sub">'+esc(x[3])+'</span></span><button class="btn btn-sm" onclick="del(\'plan\','+i+')">×</button></div>'}).join('')+'</div>'}).join('')+'</div>')}
function documents(){var folders=['Property purchase & title','Mortgage & refinance','Contributions & tracing','Bank statements','Relationship chronology','Court / VRO material','Valuations & property costs','Assets, debts & superannuation','Legal advice & correspondence','To review'];return'<div class="eyebrow">Private case workspace</div><h2 class="page-title">Documents &amp; evidence</h2><p class="lead">A local register for source files, case preparation, retrospective filing and evidence requirements.</p><div class="note"><b>Privacy:</b> Do not upload confidential legal, court, bank, title or identity documents into a public GitHub repository. Record their secure storage location here instead.</div><div class="toolbar" style="margin-top:16px"><button class="btn btn-dark" onclick="addDocument()">＋ Add document record</button><button class="btn" onclick="exportData()">Export backup</button><label class="btn">Import backup<input type="file" hidden accept="application/json" onchange="importData(event)"></label></div><div class="grid2">'+panel('Birdup Close — settlement evidence','<div class="panel-body"><div class="case"><div class="label">Property snapshot</div><div class="amount">'+money(728422.61,'AUD')+'</div><div class="sub">Indicative gross equity based on working property and mortgage figures. Requires current confirmation.</div></div><div style="margin-top:14px">'+db.caseChecklist.map(function(x,i){return'<div class="rule-row"><span><b>'+esc(x[0])+'</b><br><span class="sub">'+esc(x[1])+'</span></span><span>'+badge(x[2])+' <button class="btn btn-sm" onclick="toggleCheck('+i+')">'+(x[2]==='Complete'?'Undo':'Complete')+'</button></span></div>'}).join('')+'</div></div>')+panel('Chronology','<div class="panel-body">'+db.timeline.map(function(x){return'<div class="timeline-item"><time>'+esc(x[0])+'</time><div>'+esc(x[1])+'</div></div>'}).join('')+'<p class="sub">Evidence timeline only; it is not a legal determination.</p></div>','<button class="btn" onclick="addTimeline()">＋ Event</button>')+'</div>'+panel('Document register','<div class="table-wrap"><table><thead><tr><th>Document</th><th>Folder</th><th>Date</th><th>Linked item</th><th>Status</th><th>Notes</th><th></th></tr></thead><tbody>'+db.documents.map(function(x,i){return'<tr><td><b>'+esc(x[0])+'</b></td><td>'+esc(x[1])+'</td><td>'+esc(x[2])+'</td><td>'+esc(x[3])+'</td><td>'+badge(x[4])+'</td><td>'+esc(x[5])+'</td><td><button class="btn btn-sm" onclick="del(\'documents\','+i+')">Delete</button></td></tr>'}).join('')+'</tbody></table></div>')+panel('Retrospective folders','<div class="panel-body"><div class="grid3">'+folders.map(function(f){return'<div class="rule-row"><span>'+esc(f)+'</span><b>'+db.documents.filter(function(d){return d[1]===f}).length+'</b></div>'}).join('')+'</div></div>')}
function settings(){var s=db.settings;return'<div class="eyebrow">Model controls</div><h2 class="page-title">Planning assumptions</h2><p class="lead">These values change planning calculations only; they do not alter any source evidence.</p>'+panel('Assumptions','<div class="panel-body"><form class="form-grid" onsubmit="saveSettings(event)"><label>Tax reserve allowance (%)<input name="tax" type="number" min="0" max="100" value="'+s.tax+'"></label><label>Business operating-cost allowance (%)<input name="costs" type="number" min="0" max="100" value="'+s.costs+'"></label><label>Target cash buffer (weeks)<input name="buffer" type="number" min="0" value="'+s.buffer+'"></label><label>Consulting rate (excl GST / hour)<input name="rate" type="number" min="0" value="'+s.rate+'"></label><label>AUD → NZD exchange rate<input name="aud" type="number" min="0" step="0.01" value="'+s.aud+'"></label><div class="full"><button class="btn btn-dark">Save assumptions</button> <button type="button" class="btn btn-red" onclick="resetAll()">Reset all local data</button></div></form></div>')+panel('Backup','<div class="panel-body"><p class="lead">Export regularly. Local browser records can be lost if browser storage is cleared.</p><button class="btn btn-dark" onclick="exportData()">Export JSON backup</button> <label class="btn">Import JSON backup<input type="file" hidden accept="application/json" onchange="importData(event)"></label></div>')}
function render(){document.getElementById('barTitle').textContent=view==='plan'?'FINANCIAL FORTIFICATION':view.toUpperCase().replace('DOCUMENTS','DOCUMENTS & EVIDENCE');document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.view===view)});var pages={overview:overview,budget:budget,transactions:transactions,accounts:accounts,debts:debts,income:income,plan:plan,documents:documents,settings:settings};document.getElementById('page').innerHTML=pages[view]();if(view==='transactions')renderTransactions()}window.go=function(v){view=v;document.getElementById('rail').classList.remove('open');render()};document.getElementById('nav').onclick=function(e){var b=e.target.closest('button');if(b)go(b.dataset.view)};document.getElementById('menu').onclick=function(){document.getElementById('rail').classList.toggle('open')};window.del=function(k,i){if(confirm('Delete this record?')){db[k].splice(i,1);save();render()}};function openModal(t,b,fn){var m=document.getElementById('modal');m.innerHTML='<div class="modal-box"><div class="modal-head"><b>'+t+'</b><button class="btn btn-sm" id="x">×</button></div><div class="modal-body">'+b+'</div><div class="modal-foot"><button class="btn" id="c">Cancel</button><button class="btn btn-dark" id="s">Save</button></div></div>';m.classList.remove('hidden');function close(){m.classList.add('hidden')}document.getElementById('x').onclick=close;document.getElementById('c').onclick=close;document.getElementById('s').onclick=function(){if(fn()!==false)close()}}window.addBudget=function(){openModal('Add budget item','<div class="form-grid"><label>Item<input id="a"></label><label>Category<input id="b" value="Other"></label><label>Figure<select id="c"><option>Verified</option><option>Provisional</option><option>Derived</option><option>Advised</option></select></label><label>Priority<select id="d"><option>Survival</option><option>Stability</option><option>Recovery</option></select></label><label>Frequency<select id="e"><option>Monthly</option><option>Fortnightly</option></select></label><label>Amount<input id="f" type="number" step="0.01"></label></div>',function(){db.budget.push([a.value,b.value,c.value,d.value,e.value,Number(f.value)||0]);save();render()})};window.addAccount=function(){openModal('Add account','<div class="form-grid"><label>Account name<input id="a"></label><label>Institution<input id="b"></label><label>Scope<select id="c"><option>Personal</option><option>Business</option></select></label><label>Type<select id="d"><option>Bank</option><option>Credit card</option><option>Loan</option><option>KiwiSaver</option></select></label><label>Balance<input id="e" type="number"></label><label>Currency<select id="f"><option>NZD</option><option>AUD</option></select></label></div>',function(){db.accounts.push([a.value,b.value,c.value,d.value,Number(e.value)||0,f.value]);save();render()})};window.addDebt=function(){openModal('Add debt','<div class="form-grid"><label>Liability<input id="a"></label><label>Creditor<input id="b"></label><label>Status<input id="c" value="Current"></label><label>Balance<input id="d" type="number"></label><label>Currency<select id="e"><option>NZD</option><option>AUD</option></select></label><label>Interest rate %<input id="f" type="number" value="0"></label></div>',function(){db.debts.push([a.value,b.value,c.value,Number(d.value)||0,e.value,Number(f.value)||0]);save();render()})};window.addAsset=function(){openModal('Add asset','<div class="form-grid"><label>Asset<input id="a"></label><label>Type<input id="b"></label><label>Ownership<input id="c" value="Personal"></label><label>Value<input id="d" type="number"></label><label>Currency<select id="e"><option>NZD</option><option>AUD</option></select></label></div>',function(){db.assets.push([a.value,b.value,c.value,Number(d.value)||0,e.value]);save();render()})};window.addTransaction=function(){openModal('Add transaction','<div class="form-grid"><label>Date<input id="a" type="date"></label><label>Account<input id="b"></label><label class="full">Description<input id="c"></label><label>Amount (income positive)<input id="d" type="number"></label><label>Category<input id="e" value="Uncategorised"></label></div>',function(){db.transactions.unshift([a.value,b.value,c.value,Number(d.value)||0,e.value]);save();render()})};window.addPlan=function(){openModal('Add action','<div class="form-grid"><label>Column<select id="a"><option>Now</option><option>Next</option><option>Later</option></select></label><label>Priority<select id="b"><option>Critical</option><option>High</option><option>Medium</option></select></label><label class="full">Action<input id="c"></label><label class="full">Notes<textarea id="d"></textarea></label></div>',function(){db.plan.push([a.value,c.value,b.value,d.value]);save();render()})};window.addDocument=function(){var o=['Property purchase & title','Mortgage & refinance','Contributions & tracing','Bank statements','Relationship chronology','Court / VRO material','Valuations & property costs','Assets, debts & superannuation','Legal advice & correspondence','To review'].map(function(x){return'<option>'+x+'</option>'}).join('');openModal('Add document record','<div class="note">Record metadata only. Store the confidential source file privately.</div><div class="form-grid" style="margin-top:14px"><label>Document title<input id="a"></label><label>Document date<input id="b" type="date"></label><label>Folder<select id="c">'+o+'</select></label><label>Linked item / case<input id="d" value="Birdup Close — Property Settlement"></label><label>Status<select id="e"><option>To review</option><option>Filed</option><option>Action required</option><option>Verified</option></select></label><label class="full">Notes / secure storage reference<textarea id="f"></textarea></label></div>',function(){if(!a.value){toast('Enter a document title');return false}db.documents.push([a.value,c.value,b.value,d.value,e.value,f.value]);save();render()})};window.addTimeline=function(){openModal('Add chronology event','<div class="form-grid"><label>Date / period<input id="a"></label><label class="full">Event / evidence note<textarea id="b"></textarea></label></div>',function(){db.timeline.push([a.value,b.value]);save();render()})};window.toggleCheck=function(i){db.caseChecklist[i][2]=db.caseChecklist[i][2]==='Complete'?'Missing':'Complete';save();render()};window.saveSettings=function(e){e.preventDefault();var f=e.target;db.settings={tax:Number(f.tax.value)||0,costs:Number(f.costs.value)||0,buffer:Number(f.buffer.value)||0,rate:Number(f.rate.value)||0,aud:Number(f.aud.value)||0};save();render();toast('Assumptions saved')};window.exportData=function(){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='personal-finance-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},200);toast('Backup exported')};window.importData=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){try{db=JSON.parse(r.result);save();render();toast('Backup imported')}catch(x){toast('Invalid backup file')}};r.readAsText(f)};window.importCSV=function(e){var f=e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var rows=r.result.split(/\r?\n/).filter(Boolean).slice(1).map(function(l){return l.split(',')}).filter(function(x){return x.length>=4});rows.forEach(function(x){db.transactions.push([x[0]||'',x[1]||'',x[2]||'',parseFloat((x[3]||'0').replace(/[^0-9.-]/g,''))||0,x[4]||'Uncategorised'])});save();render();toast(rows.length+' transaction rows imported')};r.readAsText(f)};window.resetAll=function(){if(confirm('Reset all local data?')){db=JSON.parse(JSON.stringify(seed));save();render()}};try{render()}catch(err){document.getElementById('page').innerHTML='<section class="panel"><div class="panel-body"><h2 class="section-title">App startup issue</h2><p>'+esc(err.message||err)+'</p></div></section>';console.error(err)}})();
</script></body></html>
